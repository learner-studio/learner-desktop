# The whole app on a clean GitHub macOS runner. All testing happens here: every pull
# request into main must pass this job before it merges (branch protection), and main is
# checked again after each merge so the app it keeps is main's own build.
#
# Each phase of scripts/ci.sh is its own step, so this run's page shows them pass or fail
# as they happen; a failed phase does not stop the rest. The last step writes the
# PASS/FAIL table and every skipped test, with its reason, to the run's summary page.
#
# Nothing of the owner's goes here: no secrets, no logins. The test environment is
# LEARNER_TEST_ENV=runner, and every lane says so in its output.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LEARNER_TEST_ENV: runner

jobs:
  mac:
    name: mac
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # learner-server (public) at the commit config/learner-server.ref pins: its pairing
      # harness runs on this runner for the desktop + server pairing tests.
      - name: Read the pinned learner-server commit
        id: server-ref
        run: echo "sha=$(tr -d '[:space:]' < config/learner-server.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: learner-studio/learner-server
          ref: ${{ steps.server-ref.outputs.sha }}
          path: learner-server
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Use the newest Xcode on the runner
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          echo "Xcode: $newest"
          swift --version

      - name: Cache Voice ID's model and sherpa-onnx
        uses: actions/cache@v4
        with:
          path: |
            third_party/sherpa-onnx/artifacts
            menu-bar-app/Models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
          key: voice-id-${{ hashFiles('scripts/fetch-voice-id.sh') }}

      - name: fetch (Voice ID model, sherpa-onnx)
        run: scripts/ci.sh fetch
      - name: virtual-mic (BlackHole 2ch + 16ch)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh virtual-mic
      - name: grant (microphone, speech recognition)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh grant
      - name: fixtures (synthetic sample as ~/ai-vault-data)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh fixtures
      - name: Cache screenpipe's engine and models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/learner-screenpipe
            ~/.cache/huggingface/hub/models--ggerganov--whisper.cpp
            ~/Library/Caches/screenpipe
          key: screenpipe-${{ hashFiles('config/screenpipe-settings.json') }}
      - name: screenpipe (real engine on :3030)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh screenpipe
      - name: server (learner-server's pairing harness, Postgres 17)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh server
      - name: speech (Siri and Dictation on)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh speech
      - name: install (release build, started by launchd)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh install
      - name: mic-e2e (hear speech, switch inputs, hear again)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh mic-e2e
      - name: light lane
        if: ${{ !cancelled() }}
        run: scripts/ci.sh light
      - name: medium lane
        if: ${{ !cancelled() }}
        run: scripts/ci.sh medium
      # The real learner-server, through one throwaway test device. The minter's key goes
      # to these two steps only; pull requests from forks get no secrets and skip by name.
      - name: prod-device (a throwaway test device on the real server)
        if: ${{ !cancelled() }}
        env:
          LEARNER_CI_MINT_KEY: ${{ secrets.LEARNER_CI_MINT_KEY }}
        run: scripts/ci.sh prod-device
      - name: heavy lane
        if: ${{ !cancelled() }}
        run: scripts/ci.sh heavy
      - name: prod-revoke (the test device and all it wrote, removed)
        if: ${{ always() }}
        env:
          LEARNER_CI_MINT_KEY: ${{ secrets.LEARNER_CI_MINT_KEY }}
        run: scripts/ci.sh prod-revoke
      - name: updater (automatic updates' LaunchAgent loads)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh updater
      - name: uninstall (nothing left behind)
        if: ${{ !cancelled() }}
        run: scripts/ci.sh uninstall
      - name: report
        if: ${{ !cancelled() }}
        run: scripts/ci.sh report

      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-out
          path: ci-out/
          retention-days: 14

      # Only a build that passed every phase; scripts/install-latest.sh installs main's.
      - name: Keep the tested app
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: learner-desktop-app
          path: ci-app/
          retention-days: 30
